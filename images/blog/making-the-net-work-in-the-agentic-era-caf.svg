<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="f3t"><style>
.node { fill: #ffffff; stroke: #d3d9e1; stroke-width: 1.5; }
.node-plain { fill: #eceff3; stroke: #d3d9e1; stroke-width: 1.5; }
.node-accent { fill: #0b2b70; }
.net { fill: #eceff3; stroke: #d3d9e1; stroke-width: 1.5; }
.tag { fill: #eceff3; }
.tag-red { fill: #eceff3; stroke: #c4122f; stroke-width: 1.5; }
.callout-box { fill: #eceff3; stroke: #d3d9e1; }
.gate { fill: #ffffff; stroke: #c4122f; stroke-width: 2; }
.tri { fill: none; stroke: #3a4757; stroke-width: 1.5; }
.dot { fill: #ffffff; stroke: #3a4757; stroke-width: 1.5; }
.dot-net { fill: #c9d0d9; stroke: #3a4757; stroke-width: 1.2; }
