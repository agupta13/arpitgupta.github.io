 text{font-family:"Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif} svg{background:#ffffff}</style><rect width="100%" height="100%" fill="#ffffff"/>
<title id="f3t">Connect America Fund audit: of the addresses ISPs certified as served, about 55 percent were served and about 33 percent were offered 10 Mbps or more.</title>
<g class="grid">
<line x1="230" y1="20" x2="230" y2="200"/><line x1="342.5" y1="20" x2="342.5" y2="200"/><line x1="455" y1="20" x2="455" y2="200"/><line x1="567.5" y1="20" x2="567.5" y2="200"/><line x1="680" y1="20" x2="680" y2="200"/>
</g>
<text x="220" y="56" class="t-strong" text-anchor="end">Certified as served</text>
<rect x="230" y="36" width="450" height="30" rx="3" class="bar-muted"/>
<text x="672" y="56" class="t-num-sm t-on-muted" text-anchor="end">100%</text>
<text x="220" y="112" class="t-strong" text-anchor="end">Actually served</text>
<rect x="230" y="92" width="247.5" height="30" rx="3" class="bar-navy"/>
<text x="487" y="112" class="t-num-sm">~55%</text>
<text x="220" y="168" class="t-strong" text-anchor="end">Offered 10+ Mbps</text>
<rect x="230" y="148" width="148.5" height="30" rx="3" class="bar-red"/>
<text x="388" y="168" class="t-num-sm t-red">~33%</text>
<g class="t-tick" text-anchor="middle">
<text x="230" y="222">0</text><text x="342.5" y="222">25</text><text x="455" y="222">50</text><text x="567.5" y="222">75</text><text x="680" y="222">100%</text>
</g>
<text x="455" y="244" class="t-small" text-anchor="middle">share of the addresses ISPs certified under CAF (2011–2021)</text>
</svg>