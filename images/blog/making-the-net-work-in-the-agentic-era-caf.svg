.bar-red { fill: #c4122f; }
.grid line { stroke: #d3d9e1; stroke-dasharray: 2 3; }
.ln { stroke: #3a4757; stroke-width: 1.5; fill: none; }
.ln-thin { stroke: #5f6b79; stroke-width: 1; }
.ln-dash { stroke: #5f6b79; stroke-width: 1.5; stroke-dasharray: 6 5; }
.ln-dot { stroke: #5f6b79; stroke-width: 2; stroke-dasharray: 2 5; }
.ln-red { stroke: #c4122f; stroke-width: 1.5; stroke-dasharray: 6 4; }
.ah { fill: #3a4757; }
.ahr { fill: #c4122f; }
text { font-family: "Roboto Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif; }
.t-strong { font-weight: 700; font-size: 15px; fill: #15202c; }
.t-small { font-weight: 400; font-size: 13px; fill: #5f6b79; }
.t-tag { font-weight: 700; font-size: 14.5px; fill: #0b2b70; }
.t-label { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace !important; font-weight: 500; font-size: 11px; letter-spacing: .12em; fill: #5f6b79; }
.t-red { fill: #c4122f; }
.t-red-small { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace !important; font-size: 11.5px; fill: #c4122f; }
.t-on-accent { fill: #ffffff; }
.t-on-gold { fill: #1a1a1a; }
.t-on-muted { fill: #15202c; }
