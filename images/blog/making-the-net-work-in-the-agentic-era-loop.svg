<rect x="20" y="40" width="96" height="40" rx="6" class="node"/><text x="68" y="65" class="t-strong" text-anchor="middle">Monitor</text>
<rect x="128" y="34" width="104" height="52" rx="26" class="node-plain"/><text x="180" y="57" class="t-strong" text-anchor="middle">Human</text><text x="180" y="75" class="t-small" text-anchor="middle">operator</text>
<rect x="244" y="40" width="96" height="40" rx="6" class="node"/><text x="292" y="65" class="t-strong" text-anchor="middle">Control</text>
<line x1="116" y1="60" x2="126" y2="60" class="ln" marker-end="url(#ah3)"/>
<line x1="232" y1="60" x2="242" y2="60" class="ln" marker-end="url(#ah3)"/>
<rect x="20" y="168" width="320" height="50" rx="25" class="net"/><text x="180" y="198" class="t-strong" text-anchor="middle">Network</text>
<path d="M68,166 L68,82" class="ln" marker-end="url(#ah3)" fill="none"/>
<path d="M292,82 L292,166" class="ln" marker-end="url(#ah3)" fill="none"/>
<text x="76" y="128" class="t-small">telemetry</text>
<text x="284" y="128" class="t-small" text-anchor="end">decisions</text>
</g>
<g transform="translate(380,0)">
