<rect x="0" y="40" width="96" height="40" rx="6" class="node"/><text x="48" y="65" class="t-strong" text-anchor="middle">Monitor</text>
<rect x="108" y="34" width="104" height="52" rx="8" class="node-accent"/><text x="160" y="57" class="t-strong t-on-accent" text-anchor="middle">ML models</text><text x="160" y="75" class="t-small t-on-accent" text-anchor="middle">production-ready</text>
<rect x="224" y="40" width="96" height="40" rx="6" class="node"/><text x="272" y="65" class="t-strong" text-anchor="middle">Control</text>
