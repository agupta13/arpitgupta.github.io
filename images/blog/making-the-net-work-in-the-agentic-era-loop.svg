<line x1="212" y1="60" x2="222" y2="60" class="ln" marker-end="url(#ah3)"/>
<rect x="0" y="168" width="320" height="50" rx="25" class="net"/><text x="160" y="198" class="t-strong" text-anchor="middle">Network</text>
<path d="M48,166 L48,82" class="ln" marker-end="url(#ah3)" fill="none"/>
<path d="M272,82 L272,166" class="ln" marker-end="url(#ah3)" fill="none"/>
<text x="160" y="118" class="t-small" text-anchor="middle">generalizable · robust · trustworthy</text>
</g>
