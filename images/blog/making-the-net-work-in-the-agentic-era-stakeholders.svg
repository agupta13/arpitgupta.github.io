<title id="f1t">Three key players: policymakers, service providers, and users. Policymakers lower the cost of building networks; service providers lower the cost of operating them.</title>
<line x1="262" y1="152" x2="448" y2="62" class="ln-dash"/>
<line x1="262" y1="152" x2="448" y2="282" class="ln-dash"/>
<line x1="570" y1="96" x2="570" y2="248" class="ln-dot"/>
<rect x="30" y="120" width="232" height="64" rx="32" class="node"/>
<text x="146" y="149" class="t-strong" text-anchor="middle">Policymakers</text>
<text x="146" y="170" class="t-small" text-anchor="middle">FCC · NTIA · White House</text>
<rect x="450" y="30" width="240" height="64" rx="32" class="node"/>
<text x="570" y="59" class="t-strong" text-anchor="middle">Service providers</text>
<text x="570" y="80" class="t-small" text-anchor="middle">ISPs · content providers</text>
<rect x="450" y="250" width="240" height="64" rx="32" class="node"/>
<text x="570" y="288" class="t-strong" text-anchor="middle">Users</text>
<rect x="30" y="204" width="232" height="56" rx="8" class="tag"/>
<text x="146" y="227" class="t-tag" text-anchor="middle">Data-driven policymaking</text>
<text x="146" y="247" class="t-small" text-anchor="middle">lowers the cost of building</text>
<rect x="476" y="124" width="188" height="56" rx="8" class="tag"/>
<text x="570" y="147" class="t-tag" text-anchor="middle">Self-driving networks</text>
<text x="570" y="167" class="t-small" text-anchor="middle">lower the cost of operating</text>
</svg>