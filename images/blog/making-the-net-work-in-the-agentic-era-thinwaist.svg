<title id="f6t">Fragmented: each learning problem has its own data pipeline. Thin waist: one shared data generation layer, built from NetGent, NetUnicorn, and NetReplica, serves any intent on any network.</title>
<text x="20" y="22" class="t-label">FRAGMENTED</text>
<g class="fr">
<circle cx="50" cy="60" r="16" class="dot"/><circle cx="90" cy="60" r="16" class="dot"/><circle cx="150" cy="60" r="16" class="dot"/><circle cx="215" cy="60" r="16" class="dot"/>
