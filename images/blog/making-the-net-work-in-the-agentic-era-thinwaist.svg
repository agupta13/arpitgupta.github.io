</g>
<text x="135" y="262" class="t-small" text-anchor="middle">one pipeline per learning problem</text>
<text x="303" y="64" class="t-small" text-anchor="middle">learning</text><text x="303" y="80" class="t-small" text-anchor="middle">problems</text>
<text x="303" y="138" class="t-small" text-anchor="middle">data</text><text x="303" y="154" class="t-small" text-anchor="middle">generation</text>
<text x="303" y="206" class="t-small" text-anchor="middle">networks</text>
