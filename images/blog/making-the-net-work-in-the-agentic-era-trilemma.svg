 text{font-family:"Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif} svg{background:#ffffff}</style><rect width="100%" height="100%" fill="#ffffff"/>
<title id="f7t">The AI agent trilemma: general-purpose, high-stakes, automated. Today you only get two of the three. BQT-SaaS is general-purpose and high-stakes, so a person approves its plans. A self-driving network needs all three.</title>
<polygon points="250,52 80,252 420,252" class="tri"/>
<rect x="170" y="22" width="160" height="40" rx="8" class="tag-red"/><text x="250" y="48" class="t-strong t-red" text-anchor="middle">General-purpose</text>
<rect x="20" y="236" width="130" height="40" rx="8" class="tag-red"/><text x="85" y="262" class="t-strong t-red" text-anchor="middle">High-stakes</text>
<rect x="352" y="236" width="130" height="40" rx="8" class="tag-red"/><text x="417" y="262" class="t-strong t-red" text-anchor="middle">Automated</text>
<text x="250" y="182" class="t-display" text-anchor="middle">AI trilemma</text>
<text x="250" y="206" class="t-small" text-anchor="middle">pick two</text>
<line x1="150" y1="150" x2="122" y2="140" class="ln-thin"/>
<text x="118" y="128" class="t-small" text-anchor="end">BQT-SaaS:</text>
<text x="118" y="144" class="t-small" text-anchor="end">a person approves</text>
<rect x="520" y="96" width="180" height="108" rx="10" class="callout-box"/>
<text x="610" y="128" class="t-strong" text-anchor="middle">Self-driving</text>
<text x="610" y="148" class="t-strong" text-anchor="middle">networks need</text>
<text x="610" y="176" class="t-display t-red" text-anchor="middle">all three</text>
</svg>